# GCP Cloud Build → Artifact Registry → Cloud Run 배포
steps:
  # 1. Docker 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest'
      - '.'

  # 2. Artifact Registry에 Push
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}'

  # 3. Cloud Run 배포
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '1'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--port'
      - '8080'
      - '--allow-unauthenticated'
      - '--update-env-vars'
      - 'GEMINI_API_KEY=${_GEMINI_API_KEY}'

substitutions:
  _REGION: asia-northeast3
  _REPO: cloud-run-source-deploy
  _SERVICE: auto-ai-bot
  _TAG: v0-63-8
  _GEMINI_API_KEY: AIzaSyBsTcHTcYGPrJqcFgrRbPDs-7Opmax1uhA

options:
  logging: CLOUD_LOGGING_ONLY
