# GCP Cloud Build → Artifact Registry → Cloud Run 배포
steps:
  # 1. Docker 빌드 (latest 태그만 사용 — SHORT_SHA PowerShell 파싱 오류 방지)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest'
      - '.'

  # 2. Artifact Registry에 Push
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}'

  # 3. Cloud Run 배포 (latest 이미지 사용 — 트래픽 자동 전환 보장)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '1'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--port'
      - '8080'
      - '--allow-unauthenticated'
      - '--no-cpu-throttling'
      - '--add-cloudsql-instances'
      - 'quantops-trading:asia-northeast3:quantops-db'
      - '--set-env-vars'
      - 'TZ=UTC,NODE_ENV=production,INSTANCE_UNIX_SOCKET=/cloudsql/quantops-trading:asia-northeast3:quantops-db,DB_NAME=quantops,DB_USER=postgres,RISK_MAX_DAILY_DRAWDOWN_KRW=500000,RISK_MAX_POSITION_KRW=3000000,RISK_MAX_TOTAL_INVESTED_PCT=90,TRADING_MODE=live,PAPER_ONLY=false,GEMINI_ENABLED=true,LIVE_ENABLED=true,EMAIL_SMTP_HOST=smtp.gmail.com,EMAIL_TO=pch7012@naver.com'
      - '--set-secrets'
      - 'KIS_APP_KEY=kis-app-key:latest,KIS_APP_SECRET=kis-app-secret:latest,KIS_ACCOUNT_NO=kis-account-no:latest,KIS_APP_KEY_LIVE=kis-app-key-live:latest,KIS_APP_SECRET_LIVE=kis-app-secret-live:latest,KIS_ACCOUNT_NO_LIVE=kis-account-no-live:latest,DB_PASSWORD=db-password:latest,DASHBOARD_PASSWORD=dashboard-password:latest,VAPID_PUBLIC_KEY=vapid-public-key:latest,VAPID_PRIVATE_KEY=vapid-private-key:latest,GEMINI_API_KEY=gemini-api-key:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest,OPENAI_API_KEY=openai-api-key:latest,DART_API_KEY=dart-api-key:latest,EMAIL_SMTP_USER=email-smtp-user:latest,EMAIL_SMTP_PASS=email-smtp-pass:latest,GROQ_API_KEY=groq-api-key:latest'

  # 4. 트래픽을 최신 리비전으로 강제 전환 (트래픽 고정 방지)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - '${_SERVICE}'
      - '--region'
      - '${_REGION}'
      - '--to-latest'

substitutions:
  _REGION: asia-northeast3
  _REPO: quantops
  _SERVICE: ai-auto-bot

options:
  logging: CLOUD_LOGGING_ONLY
