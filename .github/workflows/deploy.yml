name: Deploy AI Auto Bot to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: quantops-trading
  REGION: asia-northeast3
  SERVICE: ai-auto-bot
  REPO: quantops

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          # WIF 방식 (WIF_PROVIDER + WIF_SERVICE_ACCOUNT 시크릿 설정 시 사용)
          # workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          # service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          # 서비스 계정 키 방식 (GCP_SA_KEY 시크릿에 JSON 내용 저장)
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build & Push
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/ai-auto-bot:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/ai-auto-bot:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --min-instances=1 \
            --max-instances=1 \
            --memory=512Mi \
            --cpu=1 \
            --port=8080 \
            --timeout=300s \
            --concurrency=80 \
            --allow-unauthenticated \
            --add-cloudsql-instances=quantops-trading:asia-northeast3:quantops-db \
            --set-env-vars="NODE_ENV=production,INSTANCE_UNIX_SOCKET=/cloudsql/quantops-trading:asia-northeast3:quantops-db,DB_NAME=quantops,DB_USER=postgres,TRADING_MODE=live,RISK_MAX_DAILY_DRAWDOWN_KRW=500000,RISK_MAX_POSITION_KRW=3000000,RISK_MAX_TOTAL_INVESTED_PCT=90" \
            --set-secrets="KIS_APP_KEY=kis-app-key:latest,KIS_APP_SECRET=kis-app-secret:latest,KIS_ACCOUNT_NO=kis-account-no:latest,KIS_APP_KEY_LIVE=kis-app-key-live:latest,KIS_APP_SECRET_LIVE=kis-app-secret-live:latest,KIS_ACCOUNT_NO_LIVE=kis-account-no-live:latest,GEMINI_API_KEY=gemini-api-key:latest,OPENAI_API_KEY=openai-api-key:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest,DB_PASSWORD=db-password:latest,DASHBOARD_PASSWORD=dashboard-password:latest,VAPID_PUBLIC_KEY=vapid-public-key:latest,VAPID_PRIVATE_KEY=vapid-private-key:latest" \
            --project=${{ env.PROJECT_ID }}
